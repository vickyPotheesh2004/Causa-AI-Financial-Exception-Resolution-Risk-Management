name: Verify Cause AI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Confirm production preflight fails closed without company configuration
        env:
          PYTHONPATH: src
        run: python -m cause_ai.preflight && exit 1 || exit 0
